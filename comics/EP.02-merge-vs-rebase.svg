<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#f05133"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.02</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">merge 还是 rebase</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Git 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：落后 20 个提交</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="332" height="66" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">我的分支落后 main 20 个提交，</text>
    <text x="102" y="120" font-size="15" fill="#0b1220">同事问我：merge 还是 rebase？</text>
    <text x="102" y="138" font-size="13" fill="#64748b">我该怎么选？</text>
    <rect x="24" y="166" width="524" height="100" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git log --oneline --graph --all</text>
    <text x="38" y="208" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">* 9a8b7c6 (main) feat: 新增导出</text>
    <text x="38" y="228" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">| * 4c5d6e7 (HEAD -> feature) wip</text>
    <text x="38" y="248" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">|/</text>
    <text x="38" y="268" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">* 2a9c7f1 chore: 初始化项目</text>
    <rect x="24" y="284" width="524" height="48" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="284" width="4" height="48" rx="2" fill="#22d3ee"/>
    <text x="40" y="304" font-size="13.5" fill="#e2e8f0">先别敲命令，先问一句：</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">这条分支有没有别人拉过、基于它开发？</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：同目标，两种历史</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="330" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">同一个目标，交出两种不同的历史。</text>
    <rect x="24" y="132" width="254" height="146" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="152" font-size="13" font-weight="bold" fill="#22d3ee">merge：保留分叉</text>
    <path d="M36,224 H264" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="48" cy="224" r="8" fill="#0e1730" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="96" cy="224" r="8" fill="#0e1730" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="144" cy="224" r="8" fill="#0e1730" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="228" cy="224" r="9" fill="#0e1730" stroke="#fbbf24" stroke-width="2.5"/>
    <path d="M96,224 C116,224 116,184 144,184 H204" stroke="#a78bfa" stroke-width="2.5" fill="none"/>
    <circle cx="144" cy="184" r="8" fill="#0e1730" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="204" cy="184" r="8" fill="#0e1730" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M204,184 C204,208 212,214 228,224" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
    <text x="228" y="248" text-anchor="middle" font-size="11" fill="#fbbf24">M 双父</text>
    <text x="144" y="170" text-anchor="middle" font-size="11" fill="#a78bfa">feature</text>
    <text x="70" y="248" text-anchor="middle" font-size="11" fill="#22d3ee">main</text>
    <rect x="290" y="132" width="254" height="146" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="304" y="152" font-size="13" font-weight="bold" fill="#a78bfa">rebase：拉成直线</text>
    <path d="M302,224 H528" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="314" cy="224" r="8" fill="#0e1730" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="366" cy="224" r="8" fill="#0e1730" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="418" cy="224" r="8" fill="#0e1730" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="470" cy="224" r="8" fill="#0e1730" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="518" cy="224" r="8" fill="#0e1730" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="442" y="248" text-anchor="middle" font-size="11" fill="#a78bfa">F1&#39; F2&#39; 新哈希</text>
    <text x="366" y="206" text-anchor="middle" font-size="11" fill="#22d3ee">main</text>
    <rect x="24" y="288" width="520" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="44" rx="2" fill="#a78bfa"/>
    <text x="40" y="308" font-size="13.5" fill="#e2e8f0">merge 多一个合并提交；rebase 改写提交副本，</text>
    <text x="40" y="326" font-size="13.5" fill="#94a3b8">原提交还在，只是没有分支指向它。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：两行命令的差别</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="300" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">那 main 分支到底能不能 rebase？</text>
    <rect x="24" y="132" width="524" height="70" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="154" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git switch feature</text>
    <text x="38" y="174" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ git rebase main</text>
    <text x="38" y="194" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">$ git push --force-with-lease</text>
    <rect x="24" y="214" width="254" height="58" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="151" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#22d3ee">公共分支</text>
    <text x="151" y="258" text-anchor="middle" font-size="12" fill="#e2e8f0">只 merge，不 rebase</text>
    <rect x="290" y="214" width="254" height="58" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="417" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#a78bfa">私有分支</text>
    <text x="417" y="258" text-anchor="middle" font-size="12" fill="#e2e8f0">可以 rebase 再强推</text>
    <rect x="24" y="284" width="524" height="48" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="284" width="4" height="48" rx="2" fill="#f472b6"/>
    <text x="40" y="304" font-size="13.5" fill="#e2e8f0">--force-with-lease 会先核对远端位置；</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">别人推了新提交，它就拒绝覆盖。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：黄金法则</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="340" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">公共分支只合并不变基，功能分支可 rebase。</text>
    <rect x="24" y="132" width="524" height="86" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="38" y="154" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace"># 功能分支跟上主干：线性、无多余合并提交</text>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git pull --rebase origin main</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git rebase -i origin/main</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># 等价于 fetch + rebase，避免多余合并</text>
    <rect x="24" y="230" width="524" height="44" rx="8" fill="#2a1a12" stroke="#f97316" stroke-opacity="0.55"/>
    <rect x="36" y="241" width="78" height="22" rx="6" fill="#f97316"/>
    <text x="75" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">坑点</text>
    <text x="124" y="257" font-size="13" fill="#e2e8f0">rebase 后普通 push 必被拒，强推会覆盖同事</text>
    <rect x="24" y="286" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="46" rx="2" fill="#f97316"/>
    <text x="40" y="306" font-size="13.5" fill="#e2e8f0">规则不是教条：别人已拉取的提交，哈希一变</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">他们的历史就和你对不上了。</text>
  </g>
</svg>
