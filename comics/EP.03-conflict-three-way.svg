<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#f05133"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.03</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">冲突的三方合并</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Git 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：一堆尖括号</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="320" height="66" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">这堆 &lt;&lt;&lt;&lt;&lt;&lt;&lt; 是什么？</text>
    <text x="102" y="120" font-size="15" fill="#0b1220">我全删了，还能跑吗？</text>
    <text x="102" y="138" font-size="13" fill="#64748b">不敢提交，也不敢问。</text>
    <rect x="24" y="160" width="524" height="138" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="182" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
    <text x="38" y="202" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">timeout: 3000</text>
    <text x="38" y="222" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">=======</text>
    <text x="38" y="242" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">timeout: 5000</text>
    <text x="38" y="262" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/pay</text>
    <text x="38" y="284" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># 上半是当前分支，下半是被合入分支</text>
    <rect x="24" y="310" width="524" height="42" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="310" width="4" height="42" rx="2" fill="#22d3ee"/>
    <text x="40" y="336" font-size="13.5" fill="#e2e8f0">标记只是把「两边都改了同一处」摆给你看。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三方，不是两方</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="342" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">冲突不是 bug，是 Git 掌握的信息不够。</text>
    <rect x="190" y="140" width="192" height="34" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="286" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fbbf24">base 共同祖先</text>
    <path d="M286,174 L286,186 M286,186 L132,204 M286,186 L440,204" stroke="#64748b" stroke-width="2" fill="none"/>
    <rect x="32" y="204" width="210" height="54" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="137" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">ours 当前分支</text>
    <text x="137" y="246" text-anchor="middle" font-size="11.5" fill="#94a3b8">你的改动</text>
    <rect x="330" y="204" width="210" height="54" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="435" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a78bfa">theirs 被合入</text>
    <text x="435" y="246" text-anchor="middle" font-size="11.5" fill="#94a3b8">对方的改动</text>
    <path d="M137,258 L137,274 M435,258 L435,274 M137,274 H435 M286,274 V288" stroke="#64748b" stroke-width="2" fill="none"/>
    <rect x="146" y="288" width="280" height="44" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="286" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f472b6">Git 只知道两边不一样</text>
    <text x="286" y="326" text-anchor="middle" font-size="11.5" fill="#94a3b8">该留哪个，只有你能决定</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：解决的标准动作</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="310" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">删掉标记就算解决了吗？</text>
    <rect x="24" y="134" width="116" height="40" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="82" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">1 看 status</text>
    <polygon points="150,154 142,149 142,159" fill="#64748b"/>
    <rect x="158" y="134" width="116" height="40" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="216" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#a78bfa">2 改文件</text>
    <polygon points="284,154 276,149 276,159" fill="#64748b"/>
    <rect x="292" y="134" width="116" height="40" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="350" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">3 git add</text>
    <polygon points="418,154 410,149 410,159" fill="#64748b"/>
    <rect x="426" y="134" width="122" height="40" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="487" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">4 commit</text>
    <rect x="24" y="188" width="524" height="82" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git checkout --ours  src/config.ts</text>
    <text x="38" y="230" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git checkout --theirs src/config.ts</text>
    <text x="38" y="252" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># 整份采用某一方，适用于配置/锁文件</text>
    <rect x="24" y="282" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="282" width="4" height="50" rx="2" fill="#f472b6"/>
    <text x="40" y="303" font-size="13.5" fill="#e2e8f0">add 才是「我处理完了」的确认信号；</text>
    <text x="40" y="323" font-size="13.5" fill="#94a3b8">没 add 的文件，commit 会拒绝继续。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：写出最终逻辑</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="332" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">删标记只是第一步，写出结果才算完。</text>
    <rect x="24" y="132" width="524" height="82" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="38" y="154" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace"># 两边都要：取 3000 做默认，5000 做重试上限</text>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">timeout: 3000</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">retryTimeout: 5000</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">$ git add src/config.ts &amp;&amp; git commit</text>
    <rect x="24" y="224" width="524" height="44" rx="8" fill="#2a1a12" stroke="#f97316" stroke-opacity="0.55"/>
    <rect x="36" y="235" width="78" height="22" rx="6" fill="#f97316"/>
    <text x="75" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">坑点</text>
    <text x="124" y="251" font-size="13" fill="#e2e8f0">只删标记不改逻辑，代码能跑但语义错了</text>
    <rect x="24" y="280" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="280" width="4" height="50" rx="2" fill="#f97316"/>
    <text x="40" y="301" font-size="13.5" fill="#e2e8f0">想推倒重来：git merge --abort；</text>
    <text x="40" y="321" font-size="13.5" fill="#94a3b8">冲突解决后先跑测试，再提交。</text>
  </g>
</svg>
