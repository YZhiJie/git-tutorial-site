<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#f05133"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.01</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">三区模型与分支指针</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Git 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：红一片怎么 add</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="318" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">我改了 3 个文件，git status</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">红一片，到底该 add 谁？</text>
    <rect x="24" y="152" width="524" height="114" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git status -s</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace"> M src/app.ts      # 改了没暂存</text>
    <text x="38" y="214" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">M  src/login.ts    # 已暂存待提交</text>
    <text x="38" y="234" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">?? docs/notes.md   # 从未被跟踪</text>
    <text x="38" y="254" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">A  src/demo.ts     # 新增已暂存</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">红字不是报错，是文件三种状态的缩写。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">两列字符：左列暂存区，右列工作区。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三个区各一份</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="326" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">三个区各存一份快照，命令只搬快照。</text>
    <rect x="32" y="150" width="150" height="62" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="107" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#22d3ee">工作区</text>
    <text x="107" y="196" text-anchor="middle" font-size="11.5" fill="#94a3b8">你正在编辑的文件</text>
    <polygon points="200,181 190,175 190,187" fill="#64748b"/>
    <text x="180" y="168" text-anchor="middle" font-size="11.5" fill="#fbbf24">git add</text>
    <rect x="212" y="150" width="150" height="62" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="287" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#a78bfa">暂存区 index</text>
    <text x="287" y="196" text-anchor="middle" font-size="11.5" fill="#94a3b8">下一次提交的内容</text>
    <polygon points="380,181 370,175 370,187" fill="#64748b"/>
    <text x="360" y="168" text-anchor="middle" font-size="11.5" fill="#fbbf24">git commit</text>
    <rect x="392" y="150" width="148" height="62" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="466" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#f472b6">版本库</text>
    <text x="466" y="196" text-anchor="middle" font-size="11.5" fill="#94a3b8">commit 对象图</text>
    <rect x="24" y="226" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="226" width="4" height="50" rx="2" fill="#a78bfa"/>
    <text x="40" y="247" font-size="13.5" fill="#e2e8f0">HEAD 不是分支本身，它指向 refs/heads/main；</text>
    <text x="40" y="267" font-size="13.5" fill="#94a3b8">分支文件里只有一个 40 位提交哈希。</text>
    <rect x="24" y="286" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="44" rx="2" fill="#22d3ee"/>
    <text x="40" y="306" font-size="13.5" fill="#e2e8f0">切换分支 = 把 HEAD 挪到另一个指针，</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">工作区文件跟着快照一起换。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：分支只是指针</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="300" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">新建分支时，Git 复制了</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">哪些文件？</text>
    <path d="M60,206 H470" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="60" cy="206" r="13" fill="#0e1730" stroke="#22d3ee" stroke-width="3"/>
    <text x="60" y="211" text-anchor="middle" font-size="11" fill="#e2e8f0">C1</text>
    <circle cx="180" cy="206" r="13" fill="#0e1730" stroke="#22d3ee" stroke-width="3"/>
    <text x="180" y="211" text-anchor="middle" font-size="11" fill="#e2e8f0">C2</text>
    <circle cx="300" cy="206" r="13" fill="#0e1730" stroke="#22d3ee" stroke-width="3"/>
    <text x="300" y="211" text-anchor="middle" font-size="11" fill="#e2e8f0">C3</text>
    <path d="M440,206 H330" stroke="#a78bfa" stroke-width="3"/>
    <path d="M180,206 C215,206 215,262 250,262 H440" stroke="#a78bfa" stroke-width="3" fill="none"/>
    <circle cx="250" cy="262" r="13" fill="#0e1730" stroke="#a78bfa" stroke-width="3"/>
    <text x="250" y="267" text-anchor="middle" font-size="11" fill="#e2e8f0">F1</text>
    <circle cx="440" cy="262" r="13" fill="#0e1730" stroke="#a78bfa" stroke-width="3"/>
    <text x="440" y="267" text-anchor="middle" font-size="11" fill="#e2e8f0">F2</text>
    <rect x="290" y="178" width="52" height="20" rx="6" fill="#22d3ee"/>
    <text x="316" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">main</text>
    <rect x="452" y="252" width="92" height="20" rx="6" fill="#a78bfa"/>
    <text x="498" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">feature</text>
    <rect x="452" y="278" width="92" height="20" rx="6" fill="#fbbf24"/>
    <text x="498" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">HEAD</text>
    <rect x="24" y="310" width="524" height="42" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="310" width="4" height="42" rx="2" fill="#f472b6"/>
    <text x="40" y="330" font-size="13.5" fill="#e2e8f0">git switch -c feature：只写一个指针文件，</text>
    <text x="40" y="347" font-size="13.5" fill="#94a3b8">不复制任何提交，所以瞬间完成。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：先看再动</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="322" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">先看 status，再小步 add -p，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">一个提交只讲一件事。</text>
    <rect x="24" y="150" width="524" height="86" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ git add -p src/app.ts</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace"># 逐块确认，只暂存这次要提交的改动</text>
    <text x="38" y="212" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ git commit -m "feat: 登录超时提示"</text>
    <text x="38" y="230" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># 提交后 status 应回到干净状态</text>
    <rect x="24" y="248" width="524" height="44" rx="8" fill="#2a1a12" stroke="#f97316" stroke-opacity="0.55"/>
    <rect x="36" y="259" width="78" height="22" rx="6" fill="#f97316"/>
    <text x="75" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">坑点</text>
    <text x="124" y="275" font-size="13" fill="#e2e8f0">git add . 会把构建产物、密钥一起提交</text>
    <rect x="24" y="302" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="302" width="4" height="46" rx="2" fill="#f97316"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">在 detached HEAD 上提交，不属于任何分支，</text>
    <text x="40" y="340" font-size="13.5" fill="#94a3b8">切走前记得先建分支接住它。</text>
  </g>
</svg>
