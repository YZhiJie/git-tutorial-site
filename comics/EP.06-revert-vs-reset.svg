<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#f05133"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.06</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">线上回滚怎么选</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Git 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：错误已上线</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="336" height="66" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">错误提交上线了，实习生说</text>
    <text x="102" y="120" font-size="15" fill="#0b1220">reset --hard 再强推最快。</text>
    <text x="102" y="138" font-size="13" fill="#64748b">可团队都在这个分支上……</text>
    <rect x="24" y="160" width="524" height="100" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="182" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace"># 高风险示范，别照抄</text>
    <text x="38" y="202" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git reset --hard HEAD~1</text>
    <text x="38" y="222" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git push --force</text>
    <text x="38" y="244" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># 别人的本地历史瞬间对不上</text>
    <rect x="24" y="274" width="524" height="58" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="274" width="4" height="58" rx="2" fill="#22d3ee"/>
    <text x="40" y="296" font-size="13.5" fill="#e2e8f0">线上分支是公共历史，改写它等于让所有人</text>
    <text x="40" y="316" font-size="13.5" fill="#94a3b8">重新对齐；回滚应该走「新增提交」这条路。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：加一笔 vs 擦一笔</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="326" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">revert 加一笔，reset 擦掉重画。</text>
    <rect x="24" y="132" width="254" height="136" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="38" y="152" font-size="12.5" font-weight="bold" fill="#34d399">revert：历史继续向前</text>
    <path d="M38,214 H252" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="52" cy="214" r="8" fill="#0e1730" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="112" cy="214" r="8" fill="#0e1730" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="172" cy="214" r="8" fill="#0e1730" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="232" cy="214" r="8" fill="#0e1730" stroke="#34d399" stroke-width="2.5"/>
    <text x="172" y="192" text-anchor="middle" font-size="11" fill="#f472b6">错误 C</text>
    <text x="232" y="242" text-anchor="middle" font-size="11" fill="#34d399">revert C</text>
    <text x="38" y="258" font-size="11.5" fill="#94a3b8">新增反向提交，所有人可安全 pull</text>
    <rect x="290" y="132" width="254" height="136" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="304" y="152" font-size="12.5" font-weight="bold" fill="#f472b6">reset：指针往回跳</text>
    <path d="M304,214 H518" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4"/>
    <circle cx="318" cy="214" r="8" fill="#0e1730" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="378" cy="214" r="8" fill="#0e1730" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="438" cy="214" r="8" fill="#0e1730" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="498" cy="214" r="8" fill="#0e1730" stroke="#64748b" stroke-width="2.5"/>
    <path d="M438,226 L438,246" stroke="#f472b6" stroke-width="2.5"/>
    <polygon points="438,250 432,240 444,240" fill="#f472b6"/>
    <rect x="398" y="252" width="80" height="18" rx="5" fill="#f472b6"/>
    <text x="438" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">HEAD</text>
    <rect x="24" y="280" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="280" width="4" height="50" rx="2" fill="#a78bfa"/>
    <text x="40" y="301" font-size="13.5" fill="#e2e8f0">线上事故：revert + 正常发布；</text>
    <text x="40" y="321" font-size="13.5" fill="#94a3b8">本地未推送：reset 更干净。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：三种 reset</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="318" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">reset 的 soft/mixed/hard 差在哪？</text>
    <rect x="24" y="132" width="524" height="58" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="38" y="154" font-size="12.5" font-weight="bold" fill="#34d399">--soft：只挪 HEAD</text>
    <text x="38" y="176" font-size="12" fill="#e2e8f0">改动留在暂存区，适合重新组合提交</text>
    <rect x="24" y="198" width="524" height="58" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="38" y="220" font-size="12.5" font-weight="bold" fill="#fbbf24">--mixed（默认）：挪 HEAD + 清暂存区</text>
    <text x="38" y="242" font-size="12" fill="#e2e8f0">改动留在工作区，可重新 add</text>
    <rect x="24" y="264" width="524" height="58" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="38" y="286" font-size="12.5" font-weight="bold" fill="#f472b6">--hard：连工作区一起清</text>
    <text x="38" y="308" font-size="12" fill="#e2e8f0">未提交改动直接消失，先 stash 再动手</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：线上只 revert</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="330" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">线上只 revert；reset 留给本地未推送。</text>
    <rect x="24" y="132" width="524" height="84" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="38" y="154" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">$ git revert a1b2c3d</text>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">$ git revert -m 1 &lt;merge-hash&gt;</text>
    <text x="38" y="194" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># -m 1 表示保留主线那一侧</text>
    <text x="38" y="210" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace"># 回滚后照常走发布流程，不 force push</text>
    <rect x="24" y="226" width="524" height="44" rx="8" fill="#2a1a12" stroke="#f97316" stroke-opacity="0.55"/>
    <rect x="36" y="237" width="78" height="22" rx="6" fill="#f97316"/>
    <text x="75" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">坑点</text>
    <text x="124" y="253" font-size="13" fill="#e2e8f0">回滚合并提交不写 -m 1，Git 会拒绝执行</text>
    <rect x="24" y="280" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="280" width="4" height="50" rx="2" fill="#f97316"/>
    <text x="40" y="301" font-size="13.5" fill="#e2e8f0">reset --hard 前先 git stash，</text>
    <text x="40" y="321" font-size="13.5" fill="#94a3b8">它不会帮你保存工作区改动。</text>
  </g>
</svg>
